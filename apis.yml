aid: orderly-health
name: Orderly Health
description: >-
  Orderly Health is a Denver, Colorado healthcare data company that keeps
  provider directories accurate and usable. Founded in 2015, its API-first
  platform uses machine learning and AI to automatically identify and repair
  inaccuracies in healthcare provider data for providers, payers, and
  health-technology companies. Its products include the Orderly Provider
  Directory (6.4M+ practitioner profiles), a Roster Automation Suite that
  normalizes and validates rosters in seconds, and Data Updates that deliver
  traceable, field-level corrections. The public Orderly Provider Directory API
  lets developers search practitioners by NPI, name, location, specialty, care
  category, accepted insurance, and DEA number, returning per-field confidence
  scores and source attribution. Orderly Health was acquired by First Choice
  Health.
